[project]
name = "edith"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn[standard]",
    "faster-whisper",
    "google-genai>=2.33.0",
    "jsonschema>=4.26.0",
    "numpy",
    "pillow",
    # simulator only
    "websockets",
    "pygame-ce",
    "opencv-python-headless",
    "sounddevice",
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 120
